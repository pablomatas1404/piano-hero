<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>YOUR BAND</title>
<style>
  :root { --fondo:#12101c; --panel:#1d1a2e; --panel2:#272340; --texto:#f2efff; --suave:#a9a3c9; --acento:#ffb454; --bajo:#4de2ff; --mder:#7dd8ff; --mizq:#b88cff; --ok:#4dff9e; --mal:#ff5d7a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--fondo); color:var(--texto); font-family:system-ui,Segoe UI,Roboto,sans-serif; overflow:hidden; }
  .pantalla { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center; gap:18px; overflow:auto; }
  .pantalla.activa { display:flex; }
  h1 { font-size:2.4rem; margin:0; letter-spacing:.04em; }
  h2 { margin:0; font-size:1.5rem; }
  p { margin:0; color:var(--suave); max-width:34em; line-height:1.5; font-size:1.1rem; }
  .cartel { background:var(--panel); border:1px solid #3b3660; border-radius:18px; padding:28px 30px; max-width:34em; font-size:1.35rem; line-height:1.5; color:var(--texto); }
  button { font:inherit; cursor:pointer; border:0; border-radius:14px; padding:12px 26px; background:var(--acento); color:#241a00; font-weight:700; font-size:1.05rem; }
  button.sec { background:var(--panel2); color:var(--texto); font-weight:600; }
  button:disabled { opacity:.4; cursor:default; }
  input[type=text] { font:inherit; font-size:1.4rem; padding:12px 16px; border-radius:12px; border:2px solid #3b3660; background:var(--panel); color:var(--texto); text-align:center; width:min(90vw,20em); }
  .fila { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; align-items:center; }
  .tarjeta { background:var(--panel); border:2px solid #3b3660; border-radius:18px; padding:20px 24px; min-width:180px; }
  .tarjeta.elegible { cursor:pointer; }
  .tarjeta.elegible:hover, .tarjeta.sel { border-color:var(--acento); }
  .tarjeta.apagada { opacity:.45; }
  .grande { font-size:3rem; }
  .misiones { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; width:min(900px,100%); }
  .chico { font-size:.9rem; color:var(--suave); }
  .estrellas { color:var(--acento); letter-spacing:.12em; }
  #barra-sup { position:absolute; top:0; left:0; right:0; display:flex; gap:10px; padding:8px 12px; align-items:center; background:rgba(18,16,28,.85); z-index:5; flex-wrap:wrap; font-size:.95rem; }
  #barra-sup .sp { flex:1; }
  #barra-sup label { display:flex; align-items:center; gap:6px; color:var(--suave); }
  #barra-sup input[type=range] { width:90px; }
  #barra-sup button { padding:6px 12px; font-size:.9rem; }
  #juego { position:absolute; inset:0; display:none; }
  #juego.activa { display:block; }
  canvas { position:absolute; left:0; right:0; bottom:0; width:100%; touch-action:none; display:block; }
  #resultado { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:rgba(18,16,28,.92); z-index:10; }
  #resultado.activa { display:flex; }
  #cuenta { position:absolute; left:50%; top:30%; transform:translateX(-50%); font-size:5rem; font-weight:800; color:var(--acento); z-index:6; pointer-events:none; text-shadow:0 0 20px rgba(0,0,0,.7); }
  .barra-carga { width:min(360px,80vw); height:10px; background:var(--panel2); border-radius:6px; overflow:hidden; }
  .barra-carga div { height:100%; width:0; background:var(--acento); transition:width .2s; }
  .opciones { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .opciones .op { background:var(--panel2); color:var(--texto); border:2px solid transparent; border-radius:12px; padding:10px 18px; cursor:pointer; font-weight:600; }
  .opciones .op.sel { border-color:var(--acento); }
</style>
</head>
<body>

<!-- 1. Nombre de la banda -->
<section class="pantalla activa" id="p-nombre">
  <div class="grande">🎸🥁🎹</div>
  <h1>YOUR BAND</h1>
  <p>Todo grupo necesita un nombre. ¿Cómo se va a llamar el tuyo?</p>
  <input type="text" id="in-nombre" value="Your Band" maxlength="30" autocomplete="off">
  <button id="b-nombre">Siguiente</button>
</section>

<!-- 2. Historia -->
<section class="pantalla" id="p-historia">
  <div class="cartel" id="cartel-txt"></div>
  <button id="b-historia">Siguiente</button>
</section>

<!-- 3. Elegir instrumento -->
<section class="pantalla" id="p-rol">
  <h2>¿Qué vas a tocar?</h2>
  <div class="fila">
    <div class="tarjeta elegible" data-rol="bajo"><div class="grande">🎸</div><h2>Bajo</h2><p class="chico">La base de la banda. Notas graves, de a una.</p></div>
    <div class="tarjeta elegible" data-rol="teclado"><div class="grande">🎹</div><h2>Teclado</h2><p class="chico">La melodía con la derecha y los acordes con la izquierda.</p></div>
  </div>
</section>

<!-- 4. Misiones -->
<section class="pantalla" id="p-menu">
  <h2 id="menu-titulo"></h2>
  <div class="chico" id="menu-nivel"></div>
  <div class="misiones" id="lista-misiones"></div>
  <div class="fila"><button class="sec" id="b-cambiar-rol">Cambiar instrumento</button><button class="sec" id="b-cambiar-nombre">Cambiar nombre</button></div>
</section>

<!-- 5. Preparar la misión -->
<section class="pantalla" id="p-prep">
  <h2 id="prep-titulo"></h2>
  <div class="chico" id="prep-sub"></div>
  <div><div class="chico">Dificultad</div><div class="opciones" id="op-nivel"></div></div>
  <div><div class="chico">Parte</div><div class="opciones" id="op-parte"></div></div>
  <div><div class="chico">Cómo</div><div class="opciones" id="op-modo"></div></div>
  <div class="barra-carga" id="carga-wrap"><div id="carga-barra"></div></div>
  <div class="chico" id="carga-txt">Cargando la banda…</div>
  <div class="fila"><button class="sec" id="b-prep-volver">Volver</button><button id="b-tocar" disabled>¡A tocar!</button></div>
</section>

<!-- 6. Juego -->
<section id="juego">
  <div id="barra-sup">
    <button class="sec" id="b-salir">✕ Salir</button>
    <button class="sec" id="b-pausa">⏸ Pausa</button>
    <span id="hud-info"></span>
    <span class="sp"></span>
    <label title="Si los ladrillos llegan antes o después que la música, corregilo acá">Sincro <input type="range" id="r-sync" min="-400" max="400" step="10" value="0"><span id="v-sync">0 ms</span></label>
    <label>Banda <input type="range" id="r-banda" min="0" max="100" value="80"></label>
    <label>Yo <input type="range" id="r-yo" min="0" max="100" value="80"></label>
    <label id="l-guia"><input type="checkbox" id="c-guia">Oír mi instrumento de la banda</label>
    <label id="l-midi"><input type="checkbox" id="c-midi">Mi teclado suena solo</label>
  </div>
  <div id="cuenta"></div>
  <canvas id="lienzo"></canvas>
  <div id="resultado">
    <h1 id="res-titulo"></h1>
    <div class="grande estrellas" id="res-estrellas"></div>
    <p id="res-detalle"></p>
    <div class="fila"><button id="b-repetir">Repetir</button><button class="sec" id="b-res-menu">Volver al menú</button></div>
  </div>
</section>

<script>
'use strict';
// ====== Datos de las misiones ======
const MISIONES = [
  { id: 'quedate', titulo: 'Quédate un poco más', estilo: 'Bolero', nivelMin: 1, carpeta: 'canciones/quedate/' },
  { id: 'prox2', titulo: 'Próximamente', estilo: '', nivelMin: 1, proximamente: true },
  { id: 'prox3', titulo: 'Próximamente', estilo: '', nivelMin: 1, proximamente: true },
  { id: 'prox4', titulo: 'Próximamente', estilo: '', nivelMin: 1, proximamente: true },
  { id: 'prox5', titulo: 'Próximamente', estilo: '', nivelMin: 2, proximamente: true },
  { id: 'prox6', titulo: 'Próximamente', estilo: '', nivelMin: 3, proximamente: true }
];
const NIVELES = [['facil', 'Fácil'], ['medio', 'Medio'], ['dificil', 'Difícil']];
const COLORES_STEM_OCULTO = { bajo: 'bajo', teclado: 'teclado' };

// ====== Guardado (con try/catch: puede fallar en ventanas privadas) ======
const LS = 'yourband_v1';
let datos = { banda: 'Your Band', rol: null, estrellas: {}, sync: 0, vistaHistoria: false };
try { const g = JSON.parse(localStorage.getItem(LS) || 'null'); if (g) datos = Object.assign(datos, g); } catch (e) {}
function guardar() { try { localStorage.setItem(LS, JSON.stringify(datos)); } catch (e) {} }
function totalEstrellas() { return Object.values(datos.estrellas).reduce((a, b) => a + b, 0); }
function nivelJugador() { return 1 + Math.floor(totalEstrellas() / 4); }

// ====== Pantallas ======
const $ = id => document.getElementById(id);
function ir(id) { document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('activa')); $('juego').classList.remove('activa'); if (id === 'juego') $('juego').classList.add('activa'); else $(id).classList.add('activa'); }

$('in-nombre').value = datos.banda || 'Your Band';
$('b-nombre').onclick = () => { datos.banda = $('in-nombre').value.trim() || 'Your Band'; guardar(); mostrarHistoria(0); };
$('in-nombre').addEventListener('keydown', e => { if (e.key === 'Enter') $('b-nombre').click(); });

const HISTORIA = () => [
  `Bienvenido a <b>${esc(datos.banda)}</b>. Una banda con muchas ganas, un local de ensayo y una canción esperando.`,
  `Ya tenemos cantante, guitarrista y baterista. Suenan lindo… pero algo falta.`,
  `Falta alguien que sostenga la base de la banda. <b>Ese alguien sos vos.</b>`
];
let hIdx = 0;
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function mostrarHistoria(i) { hIdx = i; const h = HISTORIA(); $('cartel-txt').innerHTML = h[i]; $('b-historia').textContent = i === h.length - 1 ? 'Siguiente' : 'Siguiente'; ir('p-historia'); }
$('b-historia').onclick = () => { if (hIdx < HISTORIA().length - 1) mostrarHistoria(hIdx + 1); else { datos.vistaHistoria = true; guardar(); ir('p-rol'); } };

document.querySelectorAll('[data-rol]').forEach(t => t.onclick = () => { datos.rol = t.dataset.rol; guardar(); abrirMenu(); });
$('b-cambiar-rol').onclick = () => ir('p-rol');
$('b-cambiar-nombre').onclick = () => { $('in-nombre').value = datos.banda; ir('p-nombre'); };

function claveEst(m, rol, nv) { return m + '|' + rol + '|' + nv; }
function abrirMenu() {
  $('menu-titulo').textContent = datos.banda + ' · ' + (datos.rol === 'bajo' ? '🎸 Bajo' : '🎹 Teclado');
  $('menu-nivel').innerHTML = `Nivel ${nivelJugador()} · <span class="estrellas">★</span> ${totalEstrellas()}`;
  const cont = $('lista-misiones'); cont.innerHTML = '';
  MISIONES.forEach(m => {
    const bloqueada = m.nivelMin > nivelJugador();
    const d = document.createElement('div');
    d.className = 'tarjeta' + (m.proximamente || bloqueada ? ' apagada' : ' elegible');
    let est = '';
    if (!m.proximamente && !bloqueada) {
      est = NIVELES.map(([k, n]) => `${n}: <span class="estrellas">${'★'.repeat(datos.estrellas[claveEst(m.id, datos.rol, k)] || 0) || '–'}</span>`).join('<br>');
    }
    d.innerHTML = `<div class="grande">${m.proximamente ? '🔒' : '🎵'}</div><h2>${esc(m.titulo)}</h2><div class="chico">${esc(m.estilo)}</div>` +
      (bloqueada ? `<div class="chico">Se abre en el nivel ${m.nivelMin}</div>` : '') +
      (m.proximamente && !bloqueada ? `<div class="chico">Todavía no está lista</div>` : '') +
      (est ? `<div class="chico" style="margin-top:8px">${est}</div>` : '');
    if (!m.proximamente && !bloqueada) d.onclick = () => abrirPrep(m);
    cont.appendChild(d);
  });
  ir('p-menu');
}

// ====== Carga de la canción ======
let AC = null;
const cache = {}; // id -> {capas, buffers}
async function cargarMision(m, progreso) {
  if (cache[m.id]) return cache[m.id];
  const capas = await (await fetch(m.carpeta + 'capas.json')).json();
  const buffers = {};
  let hechos = 0;
  await Promise.all(capas.stems.map(async s => {
    const ab = await (await fetch(m.carpeta + s + '.mp3')).arrayBuffer();
    buffers[s] = await new Promise((ok, no) => AC.decodeAudioData(ab, ok, no));
    hechos++; progreso(hechos / capas.stems.length);
  }));
  cache[m.id] = { capas, buffers };
  return cache[m.id];
}
function asegurarAudio() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); }

// ====== Preparar misión ======
let sel = { m: null, nv: 'facil', parte: 0, modo: 'tocar' };
function opciones(cont, lista, actual, cb) {
  cont.innerHTML = '';
  lista.forEach(([k, n]) => { const b = document.createElement('div'); b.className = 'op' + (k === actual ? ' sel' : ''); b.textContent = n; b.onclick = () => { cb(k); }; cont.appendChild(b); });
}
async function abrirPrep(m) {
  sel.m = m; ir('p-prep');
  $('prep-titulo').textContent = m.titulo;
  $('prep-sub').textContent = m.estilo + ' · ' + (datos.rol === 'bajo' ? 'Bajo' : 'Teclado');
  dibujarOpciones();
  $('b-tocar').disabled = true; $('carga-wrap').style.display = ''; $('carga-txt').textContent = 'Cargando la banda…'; $('carga-barra').style.width = '0';
  try {
    asegurarAudio();
    const c = await cargarMision(m, p => { $('carga-barra').style.width = Math.round(p * 100) + '%'; });
    $('carga-wrap').style.display = 'none'; $('carga-txt').textContent = 'Lista la banda.'; $('b-tocar').disabled = false;
    sel.datos = c; dibujarOpciones();
  } catch (e) { $('carga-txt').textContent = 'No pude cargar la canción: ' + e.message; }
}
function dibujarOpciones() {
  opciones($('op-nivel'), NIVELES, sel.nv, k => { sel.nv = k; dibujarOpciones(); });
  const partes = [['all', 'Canción completa']];
  if (sel.datos) sel.datos.capas.partes.forEach((p, i) => partes.push([String(i), p.n]));
  opciones($('op-parte'), partes, String(sel.parte), k => { sel.parte = k === 'all' ? 'all' : +k; dibujarOpciones(); });
  opciones($('op-modo'), [['tocar', 'Tocar con la banda'], ['practica', 'Practicar sin música']], sel.modo, k => { sel.modo = k; dibujarOpciones(); });
}
if (sel.parte === 0) sel.parte = 'all';
$('b-prep-volver').onclick = abrirMenu;
$('b-tocar').onclick = () => empezar();

// ====== Teclado en pantalla y sonido del jugador ======
const NOMBRES_BLANCAS = [0, 2, 4, 5, 7, 9, 11];
const esNegra = m => [1, 3, 6, 8, 10].includes(m % 12);
let teclas = {}; // midi -> {x,w,negra}
let rango = [36, 60];

let nodoBanda, nodoYo;
function montarMezcla() {
  if (nodoBanda) return;
  nodoBanda = AC.createGain(); nodoBanda.connect(AC.destination);
  nodoYo = AC.createGain(); nodoYo.connect(AC.destination);
  aplicarVolumenes();
}
function aplicarVolumenes() { if (!nodoBanda) return; nodoBanda.gain.value = $('r-banda').value / 100; nodoYo.gain.value = $('r-yo').value / 100 * 0.6; }
$('r-banda').oninput = aplicarVolumenes; $('r-yo').oninput = aplicarVolumenes;

const voces = {};
function sonarNota(midi) {
  if (!AC || voces[midi]) return;
  const f = 440 * Math.pow(2, (midi - 69) / 12), t = AC.currentTime;
  const g = AC.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(1, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.35, t + 0.4);
  const o1 = AC.createOscillator(), o2 = AC.createOscillator();
  if (datos.rol === 'bajo') { o1.type = 'triangle'; o2.type = 'sine'; o2.frequency.value = f / 2; } else { o1.type = 'triangle'; o2.type = 'sine'; o2.frequency.value = f * 2; }
  o1.frequency.value = f;
  const g2 = AC.createGain(); g2.gain.value = 0.4;
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(nodoYo);
  o1.start(t); o2.start(t);
  voces[midi] = { g, o1, o2 };
}
function soltarNota(midi) {
  const v = voces[midi]; if (!v) return; delete voces[midi];
  const t = AC.currentTime; v.g.gain.cancelScheduledValues(t); v.g.gain.setValueAtTime(v.g.gain.value, t); v.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
  v.o1.stop(t + 0.3); v.o2.stop(t + 0.3);
}

// ====== Motor de juego ======
const LOOKAHEAD = 3.2, VENTANA = 0.28;
const cv = $('lienzo'), ctx = cv.getContext('2d');
let J = null; // estado de la partida
let apretadas = {}; // midi -> true
let destello = {}; // midi -> {hasta, color}

function notasDeLaPartida() {
  const c = sel.datos.capas.capas;
  const nv = sel.nv; let lista = [];
  if (datos.rol === 'bajo') c.bajo[nv].forEach(n => lista.push({ t: n[0], d: n[1], m: n[2], mano: 'B' }));
  else { c.melodia[nv].forEach(n => lista.push({ t: n[0], d: n[1], m: n[2], mano: 'R' })); c.acordes[nv].forEach(n => lista.push({ t: n[0], d: n[1], m: n[2], mano: 'L' })); }
  lista.sort((a, b) => a.t - b.t);
  return lista;
}

function empezar() {
  asegurarAudio(); montarMezcla();
  detenerBanda();
  const duracion = sel.datos.capas.duracion;
  let a = 0, b = duracion;
  if (sel.parte !== 'all') { const p = sel.datos.capas.partes[sel.parte]; a = p.a; b = p.b; }
  let notas = notasDeLaPartida().filter(n => n.t >= a - 0.01 && n.t < b);
  notas.forEach(n => { n.estado = 0; }); // 0 pendiente, 1 acertada, 2 perdida
  const ms = notas.map(n => n.m);
  rango = [Math.min(...ms, 48) , Math.max(...ms, 60)];
  rango[0] = rango[0] - (NOMBRES_BLANCAS.includes(rango[0] % 12) ? 0 : 1); rango[1] = rango[1] + (NOMBRES_BLANCAS.includes(rango[1] % 12) ? 0 : 1);
  J = { a, b, notas, total: notas.length, aciertos: 0, combo: 0, mejorCombo: 0, pausa: false, fin: false, t0: 0, previo: 3.0, fuentes: [], pausaEn: 0 };
  $('resultado').classList.remove('activa');
  $('hud-info').textContent = '';
  $('c-guia').checked = false;
  $('l-guia').style.display = sel.modo === 'tocar' ? '' : 'none';
  $('b-pausa').textContent = '⏸ Pausa';
  ir('juego'); ajustarLienzo(); calcularTeclas();
  arrancarBanda(J.a - J.previo);
  requestAnimationFrame(cuadro);
}

// J.t0 = instante del reloj de audio en que la canción estaba en (a - previo)
function tiempoCancion() { return J.pausa ? J.pausaEn : AC.currentTime - J.t0 + J.a - J.previo; }

function arrancarBanda(desde) {
  // desde: posición de la canción (en segundos) donde arranca el reloj; negativo/antes de 'a' = cuenta regresiva
  J.t0 = AC.currentTime + 0.15 - (desde - (J.a - J.previo));
  if (sel.modo !== 'tocar') return;
  const rol = datos.rol === 'bajo' ? 'bajo' : 'teclado';
  sel.datos.capas.stems.forEach(s => {
    const src = AC.createBufferSource(); src.buffer = sel.datos.buffers[s];
    const g = AC.createGain(); g.gain.value = (s === rol) ? ($('c-guia').checked ? 0.4 : 0) : 1;
    src.connect(g); g.connect(nodoBanda);
    const cuando = J.t0 + (Math.max(0, desde) - (J.a - J.previo));
    try { src.start(Math.max(AC.currentTime, cuando), Math.max(0, desde)); } catch (e) {}
    J.fuentes.push({ src, g, s });
  });
}
function detenerBanda() { if (J) { J.fuentes.forEach(f => { try { f.src.stop(); } catch (e) {} }); J.fuentes = []; } }
$('c-guia').onchange = () => { if (!J) return; const rol = datos.rol === 'bajo' ? 'bajo' : 'teclado'; J.fuentes.forEach(f => { if (f.s === rol) f.g.gain.value = $('c-guia').checked ? 0.4 : 0; }); };

function ajustarLienzo() {
  const dpr = window.devicePixelRatio || 1, w = innerWidth, h = innerHeight - 0;
  cv.style.height = h + 'px'; cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (J) calcularTeclas();
}
addEventListener('resize', ajustarLienzo);
let altoTeclado = 130;
function calcularTeclas() {
  const w = innerWidth; teclas = {};
  const blancas = []; for (let m = rango[0]; m <= rango[1]; m++) if (!esNegra(m)) blancas.push(m);
  const bw = w / blancas.length; blancas.forEach((m, i) => { teclas[m] = { x: i * bw, w: bw, negra: false }; });
  for (let m = rango[0]; m <= rango[1]; m++) if (esNegra(m)) { const ant = teclas[m - 1]; if (ant) teclas[m] = { x: ant.x + ant.w - bw * 0.3, w: bw * 0.6, negra: true }; }
  altoTeclado = Math.max(110, Math.min(170, innerHeight * 0.2));
}

function colorNota(n) { return n.mano === 'B' ? '#4de2ff' : n.mano === 'R' ? '#7dd8ff' : '#b88cff'; }

function cuadro() {
  if (!J) return;
  const w = innerWidth, h = innerHeight, golpeY = h - altoTeclado, t = tiempoCancion() - 0; // reloj de la canción
  const sync = datos.sync / 1000;
  ctx.clearRect(0, 0, w, h);
  // fondo
  const gr = ctx.createLinearGradient(0, 0, 0, golpeY); gr.addColorStop(0, '#12101c'); gr.addColorStop(1, '#1d1a2e'); ctx.fillStyle = gr; ctx.fillRect(0, 0, w, golpeY);
  // líneas de las teclas blancas
  ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 1;
  for (const m in teclas) { const k = teclas[m]; if (!k.negra) { ctx.beginPath(); ctx.moveTo(k.x, 40); ctx.lineTo(k.x, golpeY); ctx.stroke(); } }
  // línea de golpe
  ctx.strokeStyle = 'rgba(125,216,255,.85)'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(0, golpeY); ctx.lineTo(w, golpeY); ctx.stroke(); ctx.setLineDash([]);
  const pxs = (golpeY - 50) / LOOKAHEAD;
  // ladrillos
  for (const n of J.notas) {
    const nt = n.t + sync, dt = nt - t;
    if (n.estado === 0 && t > nt + VENTANA) { n.estado = 2; J.combo = 0; }
    if (dt > LOOKAHEAD + 0.1 || dt + n.d < -0.6) continue;
    const k = teclas[n.m]; if (!k) continue;
    const y = golpeY - dt * pxs, lp = Math.max(8, n.d * pxs);
    const bw = k.negra ? k.w : k.w - 4, bx = k.x + (k.negra ? 0 : 2);
    ctx.globalAlpha = n.estado === 1 ? 0.25 : n.estado === 2 ? 0.3 : 1;
    ctx.fillStyle = n.estado === 1 ? '#4dff9e' : n.estado === 2 ? '#ff5d7a' : colorNota(n);
    ctx.beginPath(); ctx.roundRect(bx, y - lp, bw, lp, 6); ctx.fill(); ctx.globalAlpha = 1;
  }
  // teclado
  const ty = golpeY;
  for (const pas of [false, true]) {
    for (const m in teclas) {
      const k = teclas[m]; if (k.negra !== pas) continue;
      const d = destello[m], ap = apretadas[m];
      let col = k.negra ? '#16131f' : '#f4f1ff';
      if (ap) col = '#7dd8ff'; if (d && d.hasta > performance.now()) col = d.color;
      ctx.fillStyle = col;
      const kh = k.negra ? altoTeclado * 0.62 : altoTeclado;
      ctx.fillRect(k.x + 1, ty, k.w - 2, kh);
      if (!k.negra && (m % 12 === 0)) { ctx.fillStyle = '#555'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('Do' + (Math.floor(m / 12) - 1), k.x + k.w / 2, ty + altoTeclado - 8); }
    }
  }
  // HUD
  const hecho = J.notas.filter(n => n.estado === 1).length, pasadas = J.notas.filter(n => n.estado !== 0).length;
  $('hud-info').textContent = `${hecho}/${J.total} · combo ${J.combo}`;
  // cuenta regresiva
  const falta = J.a - t;
  $('cuenta').textContent = falta > 0.05 && !J.pausa ? Math.ceil(falta) : '';
  if (!J.fin && !J.pausa && t > J.b + 0.8) terminar();
  else requestAnimationFrame(cuadro);
}

function pulsar(midi, hardware) {
  if (!J || J.pausa) { if (AC && nodoYo && !(hardware && $('c-midi').checked)) sonarNota(midi); return; }
  apretadas[midi] = true;
  const pc = midi % 12, t = tiempoCancion(), sync = datos.sync / 1000;
  let mejor = null, md = 9;
  for (const n of J.notas) { if (n.estado !== 0 || n.m % 12 !== pc) continue; const d = Math.abs(n.t + sync - t); if (d < md && d <= VENTANA) { md = d; mejor = n; } }
  if (mejor) {
    mejor.estado = 1; J.aciertos++; J.combo++; J.mejorCombo = Math.max(J.mejorCombo, J.combo);
    destello[mejor.m] = { hasta: performance.now() + 180, color: '#4dff9e' };
  } else destello[midi] = { hasta: performance.now() + 120, color: '#ff5d7a' };
  if (!(hardware && $('c-midi').checked)) sonarNota(midi);
}
function soltar(midi, hardware) { delete apretadas[midi]; if (!(hardware && $('c-midi').checked)) soltarNota(midi); }

// mouse / táctil sobre el teclado
function teclaEn(x, y) {
  const ty = innerHeight - altoTeclado; if (y < ty) return null;
  let cand = null;
  for (const m in teclas) { const k = teclas[m]; if (x >= k.x && x < k.x + k.w) { if (k.negra) { if (y < ty + altoTeclado * 0.62) return +m; } else cand = +m; } }
  return cand;
}
const punteros = {};
cv.addEventListener('pointerdown', e => { const m = teclaEn(e.clientX, e.clientY); if (m != null) { punteros[e.pointerId] = m; cv.setPointerCapture(e.pointerId); pulsar(m, false); } });
cv.addEventListener('pointerup', e => { const m = punteros[e.pointerId]; if (m != null) { soltar(m, false); delete punteros[e.pointerId]; } });
cv.addEventListener('pointercancel', e => { const m = punteros[e.pointerId]; if (m != null) { soltar(m, false); delete punteros[e.pointerId]; } });

// teclado de la compu: fila de abajo = blancas, fila de arriba = negras (desde el Do más grave de la pantalla)
const TECLAS_PC = 'zxcvbnm,./';
const mapPC = {};
addEventListener('keydown', e => {
  if (e.repeat || !J) return;
  if (e.key === ' ') { e.preventDefault(); $('b-pausa').click(); return; }
  const i = 'asdfghjkl;\''.indexOf(e.key.toLowerCase()); if (i < 0) return;
  const blancas = Object.keys(teclas).map(Number).filter(m => !esNegra(m)).sort((a, b) => a - b);
  const m = blancas[i]; if (m == null) return; mapPC[e.key.toLowerCase()] = m; pulsar(m, false);
});
addEventListener('keyup', e => { const k = e.key.toLowerCase(); if (mapPC[k] != null) { soltar(mapPC[k], false); delete mapPC[k]; } });

// MIDI de verdad
let midiVisto = false;
if (navigator.requestMIDIAccess) navigator.requestMIDIAccess().then(acc => {
  const conectar = () => acc.inputs.forEach(inp => {
    if (!midiVisto) { midiVisto = true; $('c-midi').checked = true; }
    inp.onmidimessage = ev => {
      const [st, nota, vel] = ev.data, cmd = st & 0xf0;
      if (cmd === 0x90 && vel > 0) pulsar(nota, true); else if (cmd === 0x80 || (cmd === 0x90 && vel === 0)) soltar(nota, true);
    };
  });
  conectar(); acc.onstatechange = conectar;
}).catch(() => {});
$('l-midi').style.display = '';

// pausa / salir / sincro
$('b-pausa').onclick = () => {
  if (!J || J.fin) return;
  if (!J.pausa) { J.pausaEn = tiempoCancion(); J.pausa = true; detenerBanda(); $('b-pausa').textContent = '▶ Seguir'; }
  else {
    const desde = Math.max(J.a - J.previo, J.pausaEn - 2); // vuelve 2 segundos para no perderse
    J.pausa = false; $('b-pausa').textContent = '⏸ Pausa';
    arrancarBanda(desde);
    J.notas.forEach(n => { if (n.estado !== 1 && n.t + datos.sync / 1000 > desde) n.estado = 0; });
    requestAnimationFrame(cuadro);
  }
};
$('b-salir').onclick = () => { if (J) { detenerBanda(); J.fin = true; J = null; } Object.keys(voces).forEach(m => soltarNota(+m)); abrirMenu(); };
$('r-sync').value = datos.sync; $('v-sync').textContent = datos.sync + ' ms';
$('r-sync').oninput = () => { datos.sync = +$('r-sync').value; $('v-sync').textContent = datos.sync + ' ms'; guardar(); };

function terminar() {
  J.fin = true; detenerBanda();
  const pct = J.total ? J.aciertos / J.total : 0;
  const est = pct >= 0.9 ? 3 : pct >= 0.75 ? 2 : pct >= 0.5 ? 1 : 0;
  const k = claveEst(sel.m.id, datos.rol, sel.nv);
  if (sel.parte === 'all' && sel.modo === 'tocar') { if ((datos.estrellas[k] || 0) < est) { datos.estrellas[k] = est; guardar(); } }
  $('res-titulo').textContent = est >= 3 ? '¡Qué bien suena esto!' : est >= 1 ? '¡Bien, la banda te necesita!' : 'Seguí practicando';
  $('res-estrellas').textContent = '★'.repeat(est) + '☆'.repeat(3 - est);
  $('res-detalle').textContent = `Acertaste ${J.aciertos} de ${J.total} notas (${Math.round(pct * 100)}%). Mejor racha: ${J.mejorCombo}.` + (sel.parte !== 'all' || sel.modo !== 'tocar' ? ' (Las estrellas se ganan tocando la canción completa con la banda.)' : '');
  $('resultado').classList.add('activa');
}
$('b-repetir').onclick = () => empezar();
$('b-res-menu').onclick = () => { J = null; abrirMenu(); };

// ====== Arranque ======
if (datos.vistaHistoria && datos.rol) abrirMenu();
else if (datos.vistaHistoria) ir('p-rol');
</script>
